<title>EvolAI Stage Tabs</title><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F7FAFC;--bg2:#EEF3F7;--surface:#FFFFFF;--ink:#172B3A;--muted:#536575;--line:#DCE3EA;--accent:#19A999;--accent-ink:#0F7A6E;--btn:#0F7A6E;--on-btn:#FFFFFF;--blue:#4A7FE8;--amber:#FFB86A;--soft:#E6F5F3;--scrim:rgba(23,43,58,.45);--g:max(16px,env(safe-area-inset-left,0px));color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1C26;--bg2:#13242F;--surface:#172B3A;--ink:#F7FAFC;--muted:#A7B6C3;--line:#2B4458;--accent:#19A999;--accent-ink:#4FD1C1;--btn:#19A999;--on-btn:#172B3A;--soft:#173C40;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1C26;--bg2:#13242F;--surface:#172B3A;--ink:#F7FAFC;--muted:#A7B6C3;--line:#2B4458;--accent:#19A999;--accent-ink:#4FD1C1;--btn:#19A999;--on-btn:#172B3A;--soft:#173C40;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.01em}p{margin:0}
button,input,textarea{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.logo{width:26px;height:26px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn-p{background:var(--btn);color:var(--on-btn);border-color:var(--btn);font-weight:600}
.btn-p:hover{filter:brightness(1.07)}
.btn-q{border-color:transparent;background:transparent;color:var(--muted)}
.btn:focus-visible,.opt:focus-visible,a:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--accent-ink)}
.chip{min-width:40px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center}
.chip svg{width:16px;height:16px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .25s}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;flex:none}
.ck svg{width:12px;height:12px;opacity:0}.ck.on{background:var(--accent);border-color:var(--accent)}.ck.on svg{opacity:1}
/* survey */
.sv-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.sv-q{font-size:clamp(18px,2.4vw,22px);font-weight:600;margin:18px 0 6px}
.sv-opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}.opt[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.opt .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none}.opt[aria-pressed=true] .dot{border:5px solid var(--accent)}
.sv textarea{width:100%;min-height:96px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
.sv-nav{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.sv-nav .r{display:flex;gap:8px}
.why{margin-top:14px;padding:10px 12px;border-left:3px solid var(--amber);background:var(--bg2);border-radius:0 8px 8px 0;font-size:13px}
/* sheet */
.sheet{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.sheet.open{display:flex}
.sheet .card{width:min(440px,100%);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .2s ease-out}
@media (min-width:700px){.sheet{align-items:center}}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.field{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:14px 0 10px}
/* video slot */
.vid{padding:10px;display:grid;gap:8px}
.vid .frame{aspect-ratio:16/9;border-radius:9px;background:var(--bg2);border:1px dashed var(--line);display:grid;place-items:center}
.vid .frame svg{width:28px;height:28px;color:var(--muted)}
.vid b{font-size:13px;font-weight:600;line-height:1.35}
/* report */
.dial{width:132px;height:132px;flex:none}
.act{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px}
.act .d{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;color:var(--accent-ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;grid-row:span 2;align-self:start}
/* splash */
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:opacity .2s}
#splash .in{display:grid;gap:14px;justify-items:center}#splash .logo{width:44px;height:44px}
#splash .bar{width:160px}#splash .bar i{animation:fill .7s ease-out forwards}
@keyframes fill{to{width:100%}}
#splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash{display:none}*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px var(--g);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.tag{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-r{display:flex;align-items:center;gap:8px;margin-left:auto}
.prog{padding:6px 10px;display:grid;gap:5px;min-width:130px}.prog .bar{height:4px}
.lst{margin:12px 0 0;padding-left:20px;display:grid;gap:6px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px;margin-top:16px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin-top:16px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:18px var(--g) 24px;border-top:1px solid var(--line);margin-top:24px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tabs [role=tab]{flex:1;min-height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);padding:0 8px;white-space:nowrap}
.tabs [role=tab][aria-selected=true]{background:var(--soft);color:var(--ink)}
[hidden]{display:none!important}
@media (max-width:760px){.tag,.date{display:none}.prog{min-width:96px}}

.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;background:var(--surface)}
.rail .logo{margin-bottom:12px}
.rb{width:62px;padding:8px 0;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:10px;font-family:"JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.rb svg{width:22px;height:22px}.rb[aria-selected=true]{background:var(--soft);color:var(--ink)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px var(--g) 0}
.panel{padding:20px;min-height:460px}
.side{padding:14px;align-self:start;position:sticky;top:70px}
.side .tabs{margin-bottom:14px}
.jr{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0 22px}
.jr:before{content:"";position:absolute;left:16%;right:16%;top:38px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.node{position:relative;border:0;background:transparent;cursor:pointer;display:grid;justify-items:center;gap:8px;text-align:center;padding:0}
.node .ring{width:76px;height:76px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:border-color .15s,transform .15s}
.node .ring svg{width:40px;height:40px}
.node[aria-pressed=true] .ring{border-color:var(--accent);transform:scale(1.05)}
.node b{font-size:16px}.node .co{font-size:13px;color:var(--muted);max-width:220px}
.callout{margin-top:6px;padding:14px;border:1px dashed var(--line);border-radius:12px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:10px;padding:16px var(--g) 4px;overflow-x:auto;scroll-snap-type:x mandatory}
.lc{scroll-snap-align:start;padding:12px;display:grid;gap:6px;text-align:left;cursor:pointer;transition:border-color .15s}
.lc:hover{border-color:var(--accent)}.lc .top{display:flex;justify-content:space-between;align-items:center}
.lc b{font-size:14px}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.mini li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;list-style:none}.mini{padding:0;margin:0}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);padding-bottom:70px}
.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:64px;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);z-index:30;padding:4px 4px env(safe-area-inset-bottom,0)}
.rail .logo{display:none}.rb{width:auto;flex:1}
.panel{padding:16px;min-height:0}.jr{grid-template-columns:1fr;gap:18px;margin:18px 0}.jr:before{display:none}
.node{grid-template-columns:64px 1fr;justify-items:start;text-align:left;align-items:center}.node .ring{width:64px;height:64px;grid-row:span 2}.node .co{max-width:none}}
.rail{overflow-y:auto}
.rb[aria-current=true]{background:var(--soft);color:var(--ink)}
.rail-note{font-size:10px;line-height:1.35;color:var(--muted);text-align:center;padding:0 6px;margin:auto 0 4px}
:root:not([data-signed]) .s-in{display:none!important}
:root[data-signed] .s-out{display:none!important}
.tog[aria-pressed=true]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.foot .fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lc.next{border-color:var(--accent)}
.steps-l{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:2px}
.steps-l li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.back{margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px}
.col{min-width:0;display:flex;flex-direction:column;min-height:100dvh}
.col>.foot{margin-top:auto}
@media (max-width:760px){.rail-note,.rb[data-k=journey],.rb[data-k=lang]{display:none}.rb{font-size:9px;letter-spacing:.02em}.rb svg{width:20px;height:20px}.app{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}.strip{grid-auto-columns:minmax(150px,1fr)}}
.hd3{padding:8px var(--g)}
.tstrip{flex:1;min-width:0;display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;max-width:420px}
.tstrip span{flex:1;text-align:center;padding:5px 6px;border-right:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tstrip span:last-child{border-right:0}.tstrip span:nth-child(1){box-shadow:inset 0 -2px #FFB86A}.tstrip span:nth-child(2){box-shadow:inset 0 -2px #4A7FE8}.tstrip span:nth-child(3){box-shadow:inset 0 -2px #19A999}
.stage{display:flex;flex-direction:column;padding:0;min-height:520px;overflow:hidden}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
.st-b{flex:1;padding:20px}
.ctl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg2)}
.ctl .dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ctl .dots button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl .dots button[aria-current=true]{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.ctl .chip{height:36px}
@media (max-width:760px){.tstrip{display:none}.ctl .dots button span{display:none}.st-b{padding:16px}.stage{min-height:0}}
</style>

<div class="work"><main class="card stage" id="main"><div class="st-h" id="sth"></div><div class="st-b"><div id="mc"></div><section id="svw" hidden><div id="sv1"></div></section></div><div class="ctl" id="ctl"></div></main><aside class="card side" id="side"><div class="tabs" role="tablist" id="st"></div><div id="sb" style="margin-top:14px"></div></aside></div>
<div class="strip" id="strip"></div>
<footer class="foot" id="foot"></footer></div></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="card" id="shCard"></div></div>
<script>

survey:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
materials:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l4.5 2.5-4.5 2.5z"/></svg>',
progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg>',
lang:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>'};
const LOGO='<svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="18" width="7" height="9" rx="1.5" fill="#FFB86A"/><rect x="11.5" y="11" width="7" height="16" rx="1.5" fill="#4A7FE8"/><rect x="21" y="3" width="7" height="24" rx="1.5" fill="#19A999"/></svg>';
const RAIL=[['home','Home','Accueil'],['journey','Journey','Parcours'],['learn','Learn','Leçons'],['questions','Questions','Questions'],['survey','Survey','Répondre'],['materials','Materials','Ressources'],['progress','Progress','Suivi']];
function renderRail(){const r=document.getElementById('rail');r.innerHTML=LOGO+RAIL.filter(x=>x[0]!=='progress'||signed).map(x=>`<button class="rb" data-k="${x[0]}" aria-current="${x[0]===cur}">${IC[x[0]]}<span>${tr(x[1],x[2])}</span></button>`).join('')+`<button class="rb" data-k="lang" data-act="lang" aria-label="${tr('Language','Langue')}">${IC.lang}<span>${L==='en'?'FR':'EN'}</span></button>`+(signed?'':`<p class="rail-note">${tr('Sign in to keep your progress','Connectez-vous pour garder votre progression')}</p>`)}
/* steps = 5 lessons + survey + send */
function stepList(){return LESSONS.map((l,i)=>({t:tr(l.en,l.fr),d:seen.has(i),go:'learn',l:i})).concat([{t:tr('Answer the survey','Répondre au questionnaire'),d:qi>=10,go:'survey'},{t:tr('Send and start your audit','Envoyer et lancer votre audit'),d:sent,go:'send'}])}
const stepsDone=()=>stepList().filter(s=>s.d).length;
const nextStep=()=>stepList().find(s=>!s.d);
const ckc=c=>`<span class="ck ${signed&&c?'on':''}">${CHK}</span>`;
function greet(){const h=new Date().getHours();return h<12?tr('Good morning','Bonjour'):h<18?tr('Good afternoon','Bon après-midi'):tr('Good evening','Bonsoir')}
function goBtn(s,cls='btn btn-p'){return s?(s.go==='send'?`<button class="${cls}" data-act="send">${esc(s.t)}</button>`:`<button class="${cls}" data-go="${s.go}" ${s.l!=null?'data-l="'+s.l+'"':''}>${esc(s.t)}</button>`):''}
function progCard(){const n=stepsDone(),s=nextStep();return `<div class="card prog"><span class="mono">${tr('Steps done','Étapes faites')} <b style="color:var(--ink)">${n}</b>/7</span><div class="bar"><i style="width:${n/7*100}%"></i></div></div>`}
function progressHTML(){const n=stepsDone(),s=nextStep();return `<span class="mono">${tr('My progress','Ma progression')}</span><h2 style="margin:6px 0 4px">${n} ${tr('of 7 steps done','étapes faites sur 7')}</h2><div class="bar" style="margin-top:10px"><i style="width:${n/7*100}%"></i></div><ul class="steps-l">${stepList().map((x,i)=>`<li>${ckc(x.d)}<span style="flex:1">${i+1} · ${esc(x.t)}</span></li>`).join('')}</ul><div style="margin-top:16px">${s?goBtn(s):`<p class="muted">${tr('All steps done. Your space is open.','Toutes les étapes sont faites. Votre espace est ouvert.')}</p>`}</div>`}
function lessonHTML(i,pager=true){const l=LESSONS[i];return `<span class="mono">${tr('Lesson','Leçon')} ${i+1} / 5</span><h2 style="margin:6px 0 10px">${tr(l.en,l.fr)}</h2>${lessonBody(i)}`+(pager?`<div class="pg"><button class="btn" data-pg="-1" ${i===0?'disabled':''}>${tr('Back','Retour')}</button><span class="mono">${i+1} / 5</span>${i<4?`<button class="btn btn-p" data-pg="1">${tr('Next','Suivant')}</button>`:`<button class="btn btn-p" data-go="survey">${tr('Answer the survey','Répondre au questionnaire')}</button>`}</div>`:'')}
function questionsHTML(){return `<span class="mono">${tr('The ten questions','Les dix questions')}</span><h2 style="margin:6px 0 4px">${tr('What your teams will be asked','Ce que l’on demandera à vos équipes')}</h2><p class="muted">${tr('Word for word. Every question can be skipped.','Mot pour mot. Chaque question peut être passée.')}</p><div class="qgrid">${Q.map((_,j)=>qCard(j)).join('')}</div>`}
function materialsHTML(){return `<span class="mono">${tr('Materials · ten videos','Ressources · dix vidéos')}</span><h2 style="margin:6px 0 4px">${tr('Short videos, coming one by one','Des vidéos courtes, une par une')}</h2><p class="muted">${tr('Two to four minutes each.','De deux à quatre minutes chacune.')}</p><div class="vgrid">${VIDS.map((_,i)=>vidCard(i)).join('')}</div>`}
function reportHTML(){return `<span class="mono">${tr('Sample report · made-up data','Exemple de rapport · données fictives')}</span><h2 style="margin:6px 0 14px">Demo Client <span class="mono">(${tr('Sample','Exemple')})</span></h2><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${dial(62)}<div style="flex:1;min-width:200px"><span class="mono">${tr('Readiness score','Score de maturité')}</span><p style="margin-top:4px">${tr('Teams use AI, but rules on client data are unclear and repetitive work is not mapped.','Les équipes utilisent l’IA, mais les règles sur les données clients sont floues et le travail répétitif n’est pas cartographié.')}</p></div></div><div style="display:grid;gap:8px;margin-top:18px"><span class="mono">${tr('Three actions','Trois actions')}</span>${actsHtml()}</div>`}
function journeyHTML(){return `<div class="jr">${JOURNEY.map((j,i)=>`<div class="node" style="cursor:default"><span class="ring">${SI[i]}</span><b>${i+1} · ${tr(j.en,j.fr)}</b><span class="co">${esc(tr(j.sen,j.sfr))}</span></div>`).join('')}</div>`}
const SI=["<svg viewBox=\"0 0 40 40\"><rect x=\"8\" y=\"22\" width=\"24\" height=\"10\" rx=\"2\" fill=\"#FFB86A\"/></svg>","<svg viewBox=\"0 0 40 40\"><rect x=\"8\" y=\"22\" width=\"11\" height=\"10\" rx=\"2\" fill=\"#FFB86A\"/><rect x=\"21\" y=\"14\" width=\"11\" height=\"18\" rx=\"2\" fill=\"#4A7FE8\"/></svg>","<svg viewBox=\"0 0 40 40\"><rect x=\"5\" y=\"24\" width=\"8\" height=\"8\" rx=\"2\" fill=\"#FFB86A\"/><rect x=\"16\" y=\"17\" width=\"8\" height=\"15\" rx=\"2\" fill=\"#4A7FE8\"/><rect x=\"27\" y=\"9\" width=\"8\" height=\"23\" rx=\"2\" fill=\"#19A999\"/></svg>"];
function stepStrip(){const nx=nextStep();return stepList().map((s,i)=>{const lab=i<5?tr('Lesson','Leçon')+' '+(i+1):i===5?tr('Your turn','À vous'):tr('Last step','Dernière étape');const sub=i===2?'10 '+tr('questions','questions'):i===4?'10 '+tr('videos','vidéos'):i<5?'2 min':i===5?`<span data-prog-n>0</span>/10 ${tr('answered','répondues')}`:tr('Sign-in happens here','La connexion se fait ici');const at=s.go==='send'?'data-act="send"':`data-go="${s.go}" ${s.l!=null?'data-l="'+s.l+'"':''}`;return `<button class="card lc ${signed&&s===nx?'next':''}" ${at}><span class="top"><span class="mono">${lab}</span>${ckc(s.d)}</span><b>${esc(s.t)}</b><span class="muted" style="font-size:12px">${sub}</span></button>`}).join('')}
function footHTML(){return `<span class="mono">${tr('Open source · Made for teams, not for show','Open source · Fait pour les équipes')}</span><span class="fr"><button class="btn tog" data-act="preview" aria-pressed="${signed}" style="min-height:32px;font-size:13px">${tr('Preview as signed-in','Aperçu connecté')}</button><button class="btn-q btn" data-act="auditor" style="min-height:32px;font-size:13px">${tr('Auditor sign-in','Connexion auditeur')}</button></span>`}
function drawAll(){renderRail();draw();const f=document.getElementById('foot');if(f)f.innerHTML=footHTML();updProg()}
document.addEventListener('click',e=>{
 const r=e.target.closest('.rb');if(r){if(r.dataset.k!=='lang')go(r.dataset.k);return}
 const a=e.target.closest('[data-act=preview]');if(a){signed=!signed;if(signed)document.documentElement.dataset.signed='';else delete document.documentElement.dataset.signed;if(!signed&&cur==='progress')cur='home';drawAll();return}
 const p=e.target.closest('[data-pg]');if(p){lesson=Math.max(0,Math.min(4,lesson+ +p.dataset.pg));seen.add(lesson);drawAll();const m=document.getElementById('main');m&&m.scrollIntoView({block:'start'});return}
 const g=e.target.closest('[data-go]');if(g){if(g.dataset.l)lesson=+g.dataset.l;go(g.dataset.go);const m=document.getElementById('main');if(m&&m.getBoundingClientRect().top<0)m.scrollIntoView({block:'start'})}});
const STAGES=[['journey','Journey map','Carte du parcours'],['learn','Lessons','Leçons'],['survey','Survey','Questionnaire'],['report','Report preview','Aperçu du rapport'],['materials','Materials','Ressources']];
let si=0,stab='ov',step=0;
function go(v){if(v==='send'){openSheet('send');return}cur=v;if(v==='questions'){stab='qs';drawAll();if(innerWidth<1000)document.getElementById('side').scrollIntoView({block:'start'});return}if(v==='progress'){drawAll();return}const k=v==='home'?'journey':v;const i=STAGES.findIndex(s=>s[0]===k);if(i>=0)si=i;if(STAGES[si][0]==='learn')seen.add(lesson);drawAll()}
function setStage(i){si=(i+STAGES.length)%STAGES.length;const k=STAGES[si][0];cur=k==='journey'?'home':k==='report'?'home':k;if(k==='learn')seen.add(lesson);drawAll()}
const ARL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>',ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>';
function draw(){
 document.getElementById('pc').innerHTML=progCard();
 const prog=cur==='progress',k=STAGES[si][0];
 document.getElementById('sth').innerHTML=prog?`<span class="mono">${tr('My progress','Ma progression')}</span><button class="btn btn-q" data-stage="${si}" style="min-height:30px">${tr('Back to the stage','Retour à la scène')}</button>`:`<span class="mono">${tr('Stage','Scène')} ${si+1} / 5 · ${tr(STAGES[si][1],STAGES[si][2])}</span><span class="mono">${k==='survey'?'<span data-prog-n>0</span>/10':k==='learn'?(lesson+1)+'/5':''}</span>`;
 const mc=document.getElementById('mc'),svw=document.getElementById('svw');const sv=!prog&&k==='survey';svw.hidden=!sv;mc.hidden=sv;
 if(prog)mc.innerHTML=progressHTML();
 else if(k==='journey'){const j=JOURNEY[step];mc.innerHTML=`<h1 style="font-size:clamp(22px,3vw,30px)">${tr('An AI audit that starts with your teams.','Un audit IA qui commence par vos équipes.')}</h1><p class="muted" style="margin-top:6px">${tr('Open source. Read everything, answer the survey, sign in only to send it.','Open source. Lisez tout, répondez au questionnaire, connectez-vous seulement pour l’envoyer.')}</p><div class="jr">${JOURNEY.map((x,i)=>`<button class="node" aria-pressed="${i===step}" data-step="${i}"><span class="ring">${SI[i]}</span><b>${i+1} · ${tr(x.en,x.fr)}</b><span class="co">${esc(tr(x.sen,x.sfr))}</span></button>`).join('')}</div><div class="callout"><div><span class="mono">${tr('Step','Étape')} ${step+1} / 3</span><p style="margin-top:4px;font-weight:500">${esc(tr(j.sen,j.sfr))}</p></div><button class="btn btn-p" data-stage="2">${tr('Answer the 10 questions','Répondre aux 10 questions')}</button></div>`}
 else if(k==='learn')mc.innerHTML=lessonHTML(lesson);
 else if(k==='report')mc.innerHTML=reportHTML();
 else if(k==='materials')mc.innerHTML=materialsHTML();
 document.getElementById('ctl').innerHTML=`<button class="chip" data-stage="${si-1}" aria-label="${tr('Previous','Précédent')}">${ARL}</button><div class="dots">${STAGES.map((s,i)=>`<button data-stage="${i}" aria-current="${!prog&&i===si}" aria-label="${tr(s[1],s[2])}">${String(i+1).padStart(2,'0')}<span> · ${tr(s[1],s[2])}</span></button>`).join('')}</div><button class="chip" data-stage="${si+1}" aria-label="${tr('Next','Suivant')}">${ARR}</button>`;
 const T=[['ov','Overview','Aperçu'],['qs','Questions','Questions'],['rp','Report','Rapport'],['rs','Materials','Ressources']];
 document.getElementById('st').innerHTML=T.map(t=>`<button role="tab" data-st="${t[0]}" aria-selected="${t[0]===stab}">${tr(t[1],t[2])}</button>`).join('');
 const sb=document.getElementById('sb'),j=JOURNEY[step];
 if(stab==='ov')sb.innerHTML=`<span class="mono">${tr('Step','Étape')} ${step+1} · ${tr(j.en,j.fr)}</span><ul class="mini" style="margin-top:8px">${(L==='fr'?j.tfr:j.ten).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="muted" style="font-size:13px;margin-top:12px">${tr('Open to read. Sign-in only when you send the survey.','Libre à lire. Connexion seulement pour envoyer le questionnaire.')}</p>`;
 else if(stab==='qs')sb.innerHTML=`<ul class="mini">${Q.map((q,i)=>`<li style="display:flex;gap:8px"><span class="ck" data-qdot="${i}">${CHK}</span><span>${esc(q[L].p)}</span></li>`).join('')}</ul><button class="btn btn-p" style="width:100%;margin-top:12px" data-stage="2">${tr('Answer them','Y répondre')}</button>`;
 else if(stab==='rp')sb.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${dial(62,84)}<p style="font-size:13px">${tr('Every client gets a readiness score and three actions over 30, 60 and 90 days.','Chaque client reçoit un score de maturité et trois actions sur 30, 60 et 90 jours.')} <span class="mono">${tr('Sample','Exemple')}</span></p></div><button class="btn" style="width:100%;margin-top:12px" data-stage="3">${tr('Open the sample','Ouvrir l’exemple')}</button>`;
 else sb.innerHTML=`<ul class="mini">${VIDS.map(v=>`<li style="display:flex;justify-content:space-between;gap:8px"><span>${esc(tr(v[0],v[1]))}</span><span class="mono">${tr('Soon','Bientôt')}</span></li>`).join('')}</ul><button class="btn" style="width:100%;margin-top:12px" data-stage="4">${tr('Open materials','Ouvrir les ressources')}</button>`;
 document.getElementById('strip').innerHTML=stepStrip();
}
document.addEventListener('click',e=>{const s=e.target.closest('[data-stage]');if(s){setStage(+s.dataset.stage);return}const n=e.target.closest('[data-step]');if(n){step=+n.dataset.step;drawAll();return}const t=e.target.closest('[data-st]');if(t){stab=t.dataset.st;drawAll()}});

hooks.push(drawAll);mountSurvey(document.getElementById('sv1'));applyLang();
</script>
