<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EvolAI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Mockup B, "Studio": no rail, words in a top nav. Bold element = the report you will get,
   shown as a live-looking sample beside the headline. Below, the path as one numbered line. */
:root{
  --bg:#F4F7FA;--surface:#FFFFFF;--raised:#EEF3F7;--fg:#172B3A;--muted:#536575;--line:#DCE3EA;--edge:#B9C5D0;
  --accent:#0F7A6E;--on-accent:#FFFFFF;--accent-ink:#0F7A6E;--soft:#E3F4F1;
  --teal:#19A999;--blue:#4A7FE8;--amber:#FFB86A;--focus:#4A7FE8;--r:12px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1D23;--surface:#262A33;--raised:#2F3440;--fg:#E8EBF0;--muted:#A0A8B5;--line:#363C48;--edge:#4A5262;
  --accent:#2EC4B2;--on-accent:#172B3A;--accent-ink:#5AD1C2;--soft:#21403F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1D23;--surface:#262A33;--raised:#2F3440;--fg:#E8EBF0;--muted:#A0A8B5;--line:#363C48;--edge:#4A5262;
  --accent:#2EC4B2;--on-accent:#172B3A;--accent-ink:#5AD1C2;--soft:#21403F;color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p{margin:0}
button,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* Header: logo | nav with words | utilities */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:32px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:22px;font-weight:600;letter-spacing:-.02em}
.brand svg{width:32px;height:32px}
.nav{display:flex;gap:4px;height:100%}
.nav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;text-decoration:none;font-weight:600;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--accent-ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent-ink)}
.utils{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.pill svg.ring{width:32px;height:32px}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent-ink)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--raised);color:var(--fg)}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:64px 0 56px}
h1{font-size:clamp(34px,4.4vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1.08;max-width:15ch;text-wrap:balance}
.lede{font-size:19px;color:var(--muted);margin-top:16px;max-width:34ch}
.cta{display:flex;align-items:center;gap:20px;margin-top:32px;flex-wrap:wrap}
.primary{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.primary:hover{filter:brightness(1.07)}
.link{color:var(--accent-ink);font-weight:600;text-underline-offset:4px}
.trust{display:flex;align-items:center;gap:10px;margin-top:28px;color:var(--muted);font-size:15px}

/* The sample report: the one memorable element */
.report{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.report::before{content:"";position:absolute;inset:-14px 24px auto auto;width:120px;height:120px;border-radius:50%;background:var(--amber);opacity:.35;z-index:-1}
.report::after{content:"";position:absolute;left:-18px;bottom:-18px;width:140px;height:90px;background-image:radial-gradient(var(--edge) 2px,transparent 2.5px);background-size:16px 16px;z-index:-1;opacity:.8}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rhead h2{font-size:18px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--edge);font-size:13px;font-weight:600;color:var(--muted)}
.rbody{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:20px}
.score{position:relative;width:140px;height:140px}
.score svg{width:100%;height:100%;transform:rotate(-90deg)}
.score div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.score b{font-size:40px;font-weight:600;line-height:1}
.score span{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:14px}
.brow{display:grid;grid-template-columns:96px 1fr 32px;gap:12px;align-items:center;font-size:15px}
.track{height:10px;border-radius:99px;background:var(--raised);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.plan div{padding:12px;border-radius:10px;background:var(--raised)}
.plan b{display:block;font-size:15px}
.plan span{font-size:14px;color:var(--muted)}

/* Path: one numbered line */
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-head h2{font-size:28px;font-weight:600;letter-spacing:-.02em}
.sec-head p{color:var(--muted)}
.path{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding-top:4px}
.path::before{content:"";position:absolute;top:26px;left:calc(100%/14);right:calc(100%/14);height:2px;background:var(--line)}
.path::after{content:"";position:absolute;top:26px;left:calc(100%/14);width:0;height:2px;background:var(--teal)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 4px 12px;border-radius:12px}
.node .dot{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--edge);font-weight:600;margin-bottom:8px}
.node[aria-current="step"] .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.node:hover .dot{border-color:var(--accent-ink)}
.node>div{display:flex;flex-direction:column;gap:2px}
.node b{font-size:16px;font-weight:600}
.node span{font-size:14px;color:var(--muted)}
.node .last{color:var(--accent-ink)}

/* Lessons row */
.lessons{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.lesson{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none}
.lesson:hover{border-color:var(--edge)}
.lesson .tile{display:grid;place-items:center;width:44px;height:44px;border-radius:12px}
.lesson b{font-size:17px;font-weight:600}
.lesson span{font-size:15px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0;margin-top:64px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.foot nav{display:flex;gap:20px}
.foot a{color:var(--accent-ink)}

@media (max-width:1000px){.hero{grid-template-columns:1fr;gap:40px}.lessons{grid-template-columns:1fr 1fr}.pill span{display:none}}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;height:auto;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .nav a{flex:1;flex-direction:column;gap:4px;padding:8px 2px;font-size:13px}
  .nav a[aria-current="page"]::after{top:-5px;bottom:auto}
  body{padding-bottom:80px}
  .pill{display:none}
  .hero{padding:32px 0}
  .rbody{grid-template-columns:1fr;justify-items:center}.bars{width:100%}
  .plan{grid-template-columns:1fr}
  .path{grid-template-columns:1fr;gap:0}
  .path::before{top:22px;bottom:22px;left:21px;right:auto;width:2px;height:auto}
  .path::after{display:none}
  .node{flex-direction:row;text-align:left;gap:14px;padding:6px 0}
  .node .dot{margin:0}
  .node>div{display:flex;flex-direction:column}
  .lessons{grid-template-columns:1fr}
  .sec-head{flex-direction:column;align-items:start}
}
@media (prefers-reduced-motion:no-preference){.score circle.v{transition:stroke-dashoffset .9s ease-out}.track i{transition:width .9s ease-out}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="18" width="7" height="9" rx="1.5" fill="#FFB86A"/><rect x="11.5" y="11" width="7" height="16" rx="1.5" fill="#4A7FE8"/><rect x="21" y="3" width="7" height="24" rx="1.5" fill="#19A999"/></svg>EvolAI</a>
  <nav class="nav" aria-label="Sections" id="nav"></nav>
  <div class="utils">
    <div class="pill num" title="Your progress"><svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14" fill="none" stroke="var(--raised)" stroke-width="4"/><circle cx="18" cy="18" r="14" fill="none" stroke="var(--teal)" stroke-width="4" stroke-dasharray="88" stroke-dashoffset="75" transform="rotate(-90 18 18)" stroke-linecap="round"/></svg><span data-fr="1 sur 7">1 of 7</span></div>
    <div class="seg" role="group" aria-label="Language"><button aria-pressed="false" data-lang="fr">FR</button><button aria-pressed="true" data-lang="en">EN</button></div>
    <button class="icon-btn" id="theme" aria-label="Switch theme" title="Switch theme"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1 data-fr="Un audit IA qui part de vos équipes">An AI audit that starts with your teams</h1>
      <p class="lede" data-fr="10 questions par équipe. Puis un plan clair, équipe par équipe.">10 questions per team. Then a clear plan, team by team.</p>
      <div class="cta">
        <a class="primary" href="#"><svg class="i"><use href="#i-play"/></svg><span data-fr="Répondre aux questions">Start the survey</span></a>
        <a class="link" href="#" data-fr="Comment ça marche">How it works</a>
      </div>
      <p class="trust"><svg class="i"><use href="#i-shield"/></svg><span data-fr="Anonyme. Moins de 5 personnes : jamais affiché.">Anonymous. Under 5 people: never shown.</span></p>
    </div>

    <figure class="report" style="margin:0" aria-label="Sample report">
      <div class="rhead"><h2 data-fr="Votre rapport">Your report</h2><span class="tag"><svg class="i" style="width:16px;height:16px"><use href="#i-eye"/></svg><span data-fr="Exemple">Sample</span></span></div>
      <div class="rbody">
        <div class="score">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--raised)" stroke-width="12"/><circle class="v" cx="60" cy="60" r="52" fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/></svg>
          <div><b class="num">62</b><span data-fr="sur 100">of 100</span></div>
        </div>
        <div class="bars">
          <div class="brow"><span data-fr="Ventes">Sales</span><span class="track"><i style="background:var(--teal)" data-w="74"></i></span><b class="num">74</b></div>
          <div class="brow"><span data-fr="Support">Support</span><span class="track"><i style="background:var(--blue)" data-w="58"></i></span><b class="num">58</b></div>
          <div class="brow"><span data-fr="Finance">Finance</span><span class="track"><i style="background:var(--amber)" data-w="41"></i></span><b class="num">41</b></div>
        </div>
      </div>
      <div class="plan">
        <div><b data-fr="30 jours">30 days</b><span data-fr="Former 2 équipes">Train 2 teams</span></div>
        <div><b data-fr="60 jours">60 days</b><span data-fr="Lancer 1 outil">Launch 1 tool</span></div>
        <div><b data-fr="90 jours">90 days</b><span data-fr="Mesurer">Measure</span></div>
      </div>
    </figure>
  </section>

  <section aria-labelledby="path-h">
    <div class="sec-head"><h2 id="path-h" data-fr="Votre parcours">Your path</h2><p data-fr="Environ 20 minutes au total.">About 20 minutes in all.</p></div>
    <ol class="path" id="path" style="list-style:none;margin:0;padding:0"></ol>
  </section>

  <section class="lessons" aria-label="Lessons" id="lessons"></section>

  <footer class="foot"><span data-fr="Open source. Pensé pour les équipes.">Open source. Made for teams.</span><nav><a href="#" data-fr="Vie privée">Privacy</a><a href="#" data-fr="Code source">Source</a><a href="#" data-fr="Connexion équipe EvolAI">EvolAI team sign-in</a></nav></footer>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15a2 2 0 0 0-2-2H3zM21 5a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v15a2 2 0 0 1 2-2h7z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 17v-3M12 17v-6M15 17v-4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></symbol>
</svg>

<script>
const NAV=[['i-home','Home','Accueil'],['i-book','Learn','Cours'],['i-list','Survey','Questionnaire'],['i-report','Report','Rapport']];
const PATH=[['Why audit','Pourquoi','2 min'],['How it works','Comment','2 min'],['The questions','Les questions','2 min'],['What you get','Le résultat','2 min'],['Videos','Vidéos','5 min'],['Answer','Répondre','7 min'],['Send','Envoyer','Sign in','Connexion']];
const LESSONS=[['i-bulb','var(--amber)','Why audit','Pourquoi un audit','Where AI saves time.','Où l\'IA fait gagner du temps.'],['i-route','var(--blue)','How it works','Comment ça marche','Three steps, one link.','Trois étapes, un lien.'],['i-list','var(--teal)','The questions','Les questions','Read all ten first.','Lisez les dix d\'abord.'],['i-video','var(--teal)','Videos','Vidéos','Ten short clips.','Dix courtes vidéos.']];
let lang='en';const fr=()=>lang==='fr';
function render(){
  nav.innerHTML=NAV.map((n,k)=>`<a href="#" ${k===0?'aria-current="page"':''}><svg class="i"><use href="#${n[0]}"/></svg><span>${fr()?n[2]:n[1]}</span></a>`).join('');
  path.innerHTML=PATH.map((s,k)=>`<li><button class="node" style="width:100%" ${k===0?'aria-current="step"':''}><span class="dot num">${k+1}</span><div><b>${fr()?s[1]:s[0]}</b><span class="${k===6?'last':''}">${k===6?(fr()?s[3]:s[2]):s[2]}</span></div></button></li>`).join('');
  lessons.innerHTML=LESSONS.map(l=>`<a class="lesson" href="#"><span class="tile" style="background:color-mix(in srgb, ${l[1]} 18%, transparent);color:var(--fg)"><svg class="i"><use href="#${l[0]}"/></svg></span><b>${fr()?l[3]:l[2]}</b><span>${fr()?l[5]:l[4]}</span></a>`).join('');
  nav.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();nav.querySelectorAll('a').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page')});
  path.querySelectorAll('.node').forEach(b=>b.onclick=()=>{path.querySelectorAll('.node').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','step')});
}
document.querySelectorAll('[data-fr]').forEach(el=>el.dataset.en=el.textContent);
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;
  document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.querySelectorAll('[data-fr]').forEach(el=>el.textContent=el.dataset[lang]);render()});
theme.onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';theme.querySelector('use').setAttribute('href',dark?'#i-moon':'#i-sun')};
render();
// One orchestrated moment: the sample report fills in once on load.
requestAnimationFrame(()=>setTimeout(()=>{document.querySelector('.score .v').style.strokeDashoffset=327*(1-.62);document.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%')},150));
</script>
</body>
</html>
